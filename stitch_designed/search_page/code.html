<!-- TopAppBar -->
<header class="bg-[#FDFBF7] dark:bg-stone-950 font-serif tracking-tight text-stone-800 dark:text-stone-100 docked full-width top-0 border-b border-stone-100 dark:border-stone-900 flat no shadows flex items-center justify-between px-6 h-16 w-full max-w-none sticky z-40">

</button>
<h1 class="text-xl font-semibold tracking-[0.2em] text-[#C5A059] uppercase">
            Noor Quran

</button>

<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="search">search</span>
</div>
<input class="block w-full pl-12 pr-10 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-primary-container font-body-ui text-body-ui shadow-[0_4px_12px_rgba(0,0,0,0.04)]" placeholder="Search Surah or Parah..." type="text"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mic">mic</span>
</button>
</div>
<!-- Tabs -->
<div class="flex space-x-8 border-b border-outline-variant/30 mb-section-margin">
<button class="pb-4 relative text-primary font-label-caps text-label-caps uppercase tracking-wider focus:outline-none">
                Surahs

</button>
<button class="pb-4 text-on-surface-variant hover:text-on-surface transition-colors font-label-caps text-label-caps uppercase tracking-wider focus:outline-none">
                Parahs
            </button>
</div>

<!-- Surah Card 1 -->
<div class="bg-surface rounded-xl p-5 shadow-[0_4px_12px_rgba(0,0,0,0.04)] flex items-center justify-between cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full border border-primary-container flex items-center justify-center text-primary font-label-caps text-label-caps">
                        1
                    </div>
<div>
<h3 class="font-headline-section text-headline-section text-on-surface group-hover:text-primary transition-colors">Al-Fatiha</h3>
<p class="font-body-ui text-body-ui text-on-surface-variant text-sm mt-1">The Opener • 7 Verses</p>
</div>
</div>
<div class="text-right">
<p class="font-quran-text-md text-quran-text-md text-on-surface">الفاتحة</p>
</div>
</div>
<!-- Surah Card 2 -->

<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center text-outline font-label-caps text-label-caps">
                        2
                    </div>
<div>

</div>
<div class="text-right">

</div>

</div>

</div>
</div>

<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center text-outline font-label-caps text-label-caps">
