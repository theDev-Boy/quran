name: NOOR Quran - Build Release APK and AAB

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both

jobs:
  analyze-and-test:
    name: Static Analysis & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project Source
        run: flutter analyze

      - name: Run All Tests
        run: flutter test

  build-android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    needs: analyze-and-test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (All ABIs)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --release

      - name: Build App Bundle
        if: ${{ github.event.inputs.build_type == 'appbundle' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release-apks/*.apk
            artifacts/release-aab/*.aab
          name: "NOOR Quran - ${{ github.ref_name }}"
          body: |
            ## NOOR Quran - ${{ github.ref_name }}
            
            ### Translation Languages Included
            - English (Natural Human Voice)
            - Urdu (Natural Human Voice)
            - Pashto (Natural Human Voice)
            - Hindi (Natural Human Voice)
            
            ### Build Details
            - Flutter Version: 3.19.0
            - Build Date: ${{ github.event.head_commit.timestamp }}
            - Commit SHA: ${{ github.sha }}
            
            ---
            *Built automatically via GitHub Actions*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
